<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار الكاميرا</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      gap: 15px;
      padding: 20px;
      box-sizing: border-box;
    }

    h2 {
      margin-bottom: 10px;
    }

    video {
      width: 100%;
      max-width: 500px;
      border-radius: 15px;
      background: #000;
      border: 2px solid #333;
    }

    .btn-container {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .start-btn {
      background-color: #28a745;
      color: white;
    }

    .stop-btn {
      background-color: #dc3545;
      color: white;
    }

    button:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <h2>تشغيل الكاميرا 📷</h2>

  <video id="camera" autoplay playsinline></video>

  <div class="btn-container">
    <button class="start-btn" onclick="startCamera()">تشغيل الكاميرا</button>
    <button class="stop-btn" onclick="stopCamera()">إيقاف الكاميرا</button>
  </div>

  <script>
    let currentStream = null;

    async function startCamera() {
      try {
        // طلب إذن الكاميرا الخلفية إن وجدت، أو الأمامية
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        
        const videoElement = document.getElementById("camera");
        videoElement.srcObject = currentStream;
      } catch (error) {
        alert("لم يتم السماح باستخدام الكاميرا أو أنها غير متاحة.");
        console.error(error);
      }
    }

    function stopCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        document.getElementById("camera").srcObject = null;
      }
    }
  </script>

</body>
</html>
