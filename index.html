<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>لعبة الديناصور الكلاسيكية - Chrome Dino</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #f7f7f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 200px;
      background-color: #f7f7f7;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .instructions {
      margin-top: 15px;
      color: #535353;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <canvas id="gameCanvas" width="600" height="200"></canvas>
  </div>

  <div class="instructions">
    اضغط على الشاشة أو زر المسافة (Space) للقفز 🦖
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // محاكاة الأصوات برمجياً (Web Audio API)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'jump') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'score') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(500, audioCtx.currentTime);
          osc.frequency.setValueAtTime(700, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'die') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
        }
      } catch (e) {}
    }

    let isGameRunning = false;
    let gameOver = false;
    let score = 0;
    let highScore = localStorage.getItem("dino_highscore") || 0;
    let lastScoreSound = 0;
    let gameSpeed = 3.8; // سرعة سهلة ومناسبة
    let frameCount = 0;

    // الديناصور الأصلي
    const dino = {
      x: 40,
      y: 130,
      width: 44,
      height: 47,
      dy: 0,
      gravity: 0.5,
      jumpForce: -9.5,
      isGrounded: true,
      legFrame: 0,

      draw() {
        ctx.fillStyle = "#535353";
        const x = this.x;
        const y = this.y;

        // رسم الديناصور بالبيكسل (الشكل المطبق بالكامل للعبة الأصلية)
        // الرأس والرؤية
        ctx.fillRect(x + 22, y, 22, 16);
        ctx.fillRect(x + 18, y + 4, 4, 12);
        ctx.fillRect(x + 40, y + 8, 4, 8);
        ctx.fillStyle = "#f7f7f7";
        ctx.fillRect(x + 26, y + 2, 4, 4); // العين

        ctx.fillStyle = "#535353";
        // الفم
        ctx.fillRect(x + 30, y + 10, 14, 2);

        // الجسم واليد
        ctx.fillRect(x + 10, y + 16, 26, 18);
        ctx.fillRect(x + 32, y + 20, 8, 4); // اليد
        ctx.fillRect(x + 6, y + 18, 4, 12);  // الذيل
        ctx.fillRect(x + 2, y + 20, 4, 8);

        // الأرجل مع حركة الركض
        if (this.isGrounded && isGameRunning) {
          if (Math.floor(frameCount / 7) % 2 === 0) {
            // رجل 1
            ctx.fillRect(x + 14, y + 34, 4, 10);
            ctx.fillRect(x + 14, y + 44, 8, 3);
            // رجل 2 مرتفعة
            ctx.fillRect(x + 26, y + 34, 4, 6);
          } else {
            // رجل 1 مرتفعة
            ctx.fillRect(x + 14, y + 34, 4, 6);
            // رجل 2
            ctx.fillRect(x + 26, y + 34, 4, 10);
            ctx.fillRect(x + 26, y + 44, 8, 3);
          }
        } else {
          // في الهواء عند القفز
          ctx.fillRect(x + 14, y + 34, 4, 8);
          ctx.fillRect(x + 14, y + 42, 6, 3);
          ctx.fillRect(x + 26, y + 34, 4, 8);
          ctx.fillRect(x + 26, y + 42, 6, 3);
        }
      },

      jump() {
        if (this.isGrounded) {
          this.dy = this.jumpForce;
          this.isGrounded = false;
          playSound('jump');
        }
      },

      update() {
        this.dy += this.gravity;
        this.y += this.dy;

        if (this.y + this.height >= 177) {
          this.y = 177 - this.height;
          this.dy = 0;
          this.isGrounded = true;
        }
      }
    };

    // الصبار الأصلي
    let obstacles = [];
    let minDistanceBetweenObstacles = 320; // مسافة أمان واسعة لجعل اللعبة سهلة

    function spawnObstacle() {
      const type = Math.random() > 0.4 ? 'small' : 'large';
      const isGroup = Math.random() > 0.7;

      let width = type === 'small' ? 17 : 24;
      let height = type === 'small' ? 35 : 46;

      if (isGroup) width *= 2;

      obstacles.push({
        x: canvas.width + 20,
        y: 177 - height,
        width: width,
        height: height,
        type: type,
        isGroup: isGroup
      });
    }

    function drawCactus(obs) {
      ctx.fillStyle = "#535353";
      const x = obs.x;
      const y = obs.y;
      const h = obs.height;

      // ساق الصبار الرئيسي
      ctx.fillRect(x + obs.width * 0.35, y, obs.width * 0.3, h);

      // الأغصان الجانبية
      ctx.fillRect(x, y + h * 0.3, obs.width * 0.35, 4);
      ctx.fillRect(x, y + h * 0.15, 4, h * 0.2);

      ctx.fillRect(x + obs.width * 0.65, y + h * 0.4, obs.width * 0.35, 4);
      ctx.fillRect(x + obs.width - 4, y + h * 0.25, 4, h * 0.2);
    }

    // الغيوم والحصى (الأرضية)
    let clouds = [];
    let gravels = [];

    function initEnvironment() {
      clouds = [
        { x: 100, y: 30 },
        { x: 300, y: 50 },
        { x: 500, y: 25 }
      ];

      gravels = [];
      for (let i = 0; i < 20; i++) {
        gravels.push({
          x: Math.random() * canvas.width,
          y: 178 + Math.random() * 18,
          size: Math.random() > 0.5 ? 2 : 1
        });
      }
    }

    function updateEnvironment() {
      // الغيوم
      clouds.forEach(cloud => {
        cloud.x -= gameSpeed * 0.2;
        if (cloud.x < -50) cloud.x = canvas.width + Math.random() * 50;

        ctx.fillStyle = "#d3d3d3";
        ctx.fillRect(cloud.x, cloud.y, 34, 10);
        ctx.fillRect(cloud.x + 8, cloud.y - 6, 18, 6);
      });

      // خط الأرضية
      ctx.strokeStyle = "#535353";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, 177);
      ctx.lineTo(canvas.width, 177);
      ctx.stroke();

      // الحصى والرمال
      ctx.fillStyle = "#777777";
      gravels.forEach(g => {
        g.x -= gameSpeed;
        if (g.x < 0) g.x = canvas.width + Math.random() * 20;
        ctx.fillRect(g.x, g.y, g.size, 1);
      });
    }

    // التحكم والقفز
    function handleInput() {
      initAudio();
      if (!isGameRunning && !gameOver) {
        isGameRunning = true;
        gameLoop();
      } else if (gameOver) {
        resetGame();
      } else {
        dino.jump();
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp") handleInput();
    });

    window.addEventListener("touchstart", (e) => {
      e.preventDefault();
      handleInput();
    }, { passive: false });

    function resetGame() {
      obstacles = [];
      score = 0;
      lastScoreSound = 0;
      gameSpeed = 3.8;
      gameOver = false;
      isGameRunning = true;
      dino.y = 130;
      dino.dy = 0;
      initEnvironment();
      gameLoop();
    }

    function gameLoop() {
      if (gameOver) return;

      frameCount++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      updateEnvironment();

      // الديناصور
      dino.update();
      dino.draw();

      // توليد الصبار بمسافات متباعدة وسهلة
      let lastObstacleX = obstacles.length > 0 ? obstacles[obstacles.length - 1].x : 0;
      if (canvas.width - lastObstacleX > minDistanceBetweenObstacles) {
        if (Math.random() < 0.02) {
          spawnObstacle();
        }
      }

      // تحريك ورسم الصبار
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= gameSpeed;

        drawCactus(obs);

        // فحص التصادم الدقيق
        if (
          dino.x + 8 < obs.x + obs.width &&
          dino.x + dino.width - 8 > obs.x &&
          dino.y + 4 < obs.y + obs.height &&
          dino.y + dino.height > obs.y
        ) {
          gameOver = true;
          isGameRunning = false;
          playSound('die');

          if (score > highScore) {
            highScore = Math.floor(score);
            localStorage.setItem("dino_highscore", highScore);
          }
        }

        if (obs.x + obs.width < 0) {
          obstacles.splice(i, 1);
        }
      }

      // النتيجة والتسارع التدريجي البطيء جداً
      if (isGameRunning) {
        score += 0.12;
        gameSpeed += 0.0002;

        // صوت كل 100 نقطة
        let currentIntScore = Math.floor(score);
        if (currentIntScore > 0 && currentIntScore % 100 === 0 && currentIntScore !== lastScoreSound) {
          playSound('score');
          lastScoreSound = currentIntScore;
        }
      }

      // كتابة النقاط كاللعبة الأصلية
      ctx.fillStyle = "#535353";
      ctx.font = "14px 'Courier New', Courier, monospace";
      ctx.fillText(`HI ${String(Math.floor(highScore)).padStart(5, '0')}  ${String(Math.floor(score)).padStart(5, '0')}`, canvas.width - 170, 25);

      // شاشة النهاية الأصلية
      if (gameOver) {
        ctx.fillStyle = "#535353";
        ctx.font = "16px 'Courier New', Courier, monospace";
        ctx.fillText("G A M E   O V E R", canvas.width / 2 - 80, 85);
        
        // رسم زر إعطاء المحاولة (Reset Icon)
        const rx = canvas.width / 2 - 12;
        const ry = 105;
        ctx.beginPath();
        ctx.arc(rx + 12, ry + 12, 10, 0, Math.PI * 1.5);
        ctx.strokeStyle = "#535353";
        ctx.lineWidth = 3;
        ctx.stroke();
      } else {
        requestAnimationFrame(gameLoop);
      }
    }

    // التهيئة البدائية
    initEnvironment();
    dino.draw();
    ctx.fillStyle = "#535353";
    ctx.font = "14px 'Courier New', Courier, monospace";
    ctx.fillText("اضغط للبدء ▶", canvas.width / 2 - 45, 90);
  </script>

</body>
</html>
