<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>لعبة الديناصور - Chrome Dino</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #f7f7f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 200px;
      background-color: #fff;
      border-bottom: 2px solid #535353;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .instructions {
      margin-top: 15px;
      color: #535353;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <canvas id="gameCanvas" width="600" height="200"></canvas>
  </div>

  <div class="instructions">
    اضغط على الشاشة أو زر المسافة (Space) للقفز 🦖
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let isGameRunning = false;
    let gameOver = false;
    let score = 0;
    let highScore = localStorage.getItem("dino_highscore") || 0;
    let gameSpeed = 5;
    let frameCount = 0;

    // الديناصور
    const dino = {
      x: 50,
      y: 150,
      width: 24,
      height: 26,
      dy: 0,
      gravity: 0.6,
      jumpForce: -10,
      isGrounded: true,
      legFrame: 0,
      draw() {
        ctx.fillStyle = "#535353";
        // جسم الديناصور
        ctx.fillRect(this.x, this.y, this.width, this.height);
        // الرأس
        ctx.fillRect(this.x + 10, this.y - 10, 18, 12);
        // العين
        ctx.fillStyle = "#fff";
        ctx.fillRect(this.x + 22, this.y - 8, 3, 3);
        
        // الأرجل (تتحرك أثناء الركض)
        ctx.fillStyle = "#535353";
        if (this.isGrounded && isGameRunning) {
          if (Math.floor(frameCount / 6) % 2 === 0) {
            ctx.fillRect(this.x + 4, this.y + this.height, 4, 6);
            ctx.fillRect(this.x + 16, this.y + this.height, 4, 2);
          } else {
            ctx.fillRect(this.x + 4, this.y + this.height, 4, 2);
            ctx.fillRect(this.x + 16, this.y + this.height, 4, 6);
          }
        } else {
          ctx.fillRect(this.x + 4, this.y + this.height, 4, 6);
          ctx.fillRect(this.x + 16, this.y + this.height, 4, 6);
        }
      },
      jump() {
        if (this.isGrounded) {
          this.dy = this.jumpForce;
          this.isGrounded = false;
        }
      },
      update() {
        this.dy += this.gravity;
        this.y += this.dy;

        // الأرضية
        if (this.y + this.height >= 170) {
          this.y = 170 - this.height;
          this.dy = 0;
          this.isGrounded = true;
        }
      }
    };

    // العقبات (الصبار)
    let obstacles = [];

    function spawnObstacle() {
      const height = 20 + Math.random() * 15;
      obstacles.push({
        x: canvas.width,
        y: 170 - height,
        width: 12 + Math.random() * 8,
        height: height
      });
    }

    // رسم الأرضية
    function drawGround() {
      ctx.strokeStyle = "#535353";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 170);
      ctx.lineTo(canvas.width, 170);
      ctx.stroke();
    }

    // القفز باللمس أو لوحة المفاتيح
    function handleInput() {
      if (!isGameRunning && !gameOver) {
        isGameRunning = true;
        gameLoop();
      } else if (gameOver) {
        resetGame();
      } else {
        dino.jump();
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp") handleInput();
    });

    window.addEventListener("touchstart", (e) => {
      e.preventDefault();
      handleInput();
    }, { passive: false });

    function resetGame() {
      obstacles = [];
      score = 0;
      gameSpeed = 5;
      gameOver = false;
      isGameRunning = true;
      dino.y = 150;
      dino.dy = 0;
      gameLoop();
    }

    function gameLoop() {
      if (gameOver) return;

      frameCount++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawGround();

      // الديناصور
      dino.update();
      dino.draw();

      // توليد العقبات
      if (frameCount % Math.floor(1000 / (gameSpeed * 10)) === 0) {
        if (Math.random() > 0.3) spawnObstacle();
      }

      // تحريك الصبار ورسمه
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= gameSpeed;

        ctx.fillStyle = "#535353";
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

        // فحص التصادم
        if (
          dino.x < obs.x + obs.width &&
          dino.x + dino.width > obs.x &&
          dino.y < obs.y + obs.height &&
          dino.y + dino.height > obs.y
        ) {
          gameOver = true;
          isGameRunning = false;
          if (score > highScore) {
            highScore = Math.floor(score);
            localStorage.setItem("dino_highscore", highScore);
          }
        }

        // مسح العقبات التي خرجت من الشاشة
        if (obs.x + obs.width < 0) {
          obstacles.splice(i, 1);
        }
      }

      // زيادة النتيجة والسرعة
      if (isGameRunning) {
        score += 0.15;
        gameSpeed += 0.0005;
      }

      // كتابة النقاط
      ctx.fillStyle = "#535353";
      ctx.font = "14px 'Courier New', Courier, monospace";
      ctx.fillText(`HI ${String(Math.floor(highScore)).padStart(5, '0')}  ${String(Math.floor(score)).padStart(5, '0')}`, canvas.width - 160, 25);

      // شاشة النهاية
      if (gameOver) {
        ctx.fillStyle = "#535353";
        ctx.font = "18px 'Courier New', Courier, monospace";
        ctx.fillText("G A M E   O V E R", canvas.width / 2 - 90, 90);
        ctx.font = "12px 'Courier New', Courier, monospace";
        ctx.fillText("اضغط لإعادة اللعب 🔄", canvas.width / 2 - 65, 115);
      } else {
        requestAnimationFrame(gameLoop);
      }
    }

    // الرسم المبدئي قبل البدء
    drawGround();
    dino.draw();
    ctx.fillStyle = "#535353";
    ctx.font = "14px 'Courier New', Courier, monospace";
    ctx.fillText("اضغط للبدء ▶", canvas.width / 2 - 45, 90);
  </script>

</body>
</html>
