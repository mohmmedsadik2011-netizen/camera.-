<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-family: Arial;
      gap: 15px;
    }

    video {
      width: 90%;
      max-width: 500px;
      border-radius: 15px;
      background: #000;
    }

    button {
      padding: 14px 25px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h2>📷 تجربة الكاميرا</h2>

  <video id="camera" autoplay playsinline></video>

  <button onclick="startCamera()">تشغيل الكاميرا</button>

  <script>
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        document.getElementById("camera").srcObject = stream;

      } catch (error) {
        alert("لم يتم السماح باستخدام الكاميرا.");
        console.log(error);
      }
    }
  </script>

</body>
</html>
